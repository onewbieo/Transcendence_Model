services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: transcendence_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: transcendence
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcendence_user -d transcendence"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "5433:5432"

  backend:
    build: ./backend
    env_file:
      - ./backend/.env.docker
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ft_transcendence-frontend
    build: ./frontend
    command: ["sh", "-c", "echo frontend image built"]

  nginx:
    build: ./docker/nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"

volumes:
  pgdata:

